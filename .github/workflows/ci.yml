name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck on DUMB scripts and test mocks
        run: |
          shellcheck --severity=warning "scripts/unraid/Mount Script (DUMB)" \
                                       "scripts/unraid/Symlink Cleanup (DUMB)" \
                                       "scripts/unraid/Plex Mount Monitor (DUMB)" \
                                       "scripts/unraid/Array Stop Script (DUMB)" \
                                       tests/helpers/mocks/*

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats, sqlite3 and jq
        run: sudo apt-get install -y bats sqlite3 jq
      - name: Run bats tests
        run: bats tests/
